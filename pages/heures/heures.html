<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Heures de Projets Prestées</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>
    <header class="header-banner">
        <h1 class="logo">Thomas Préat</h1>

        <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Ouvrir le menu">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </button>
        <nav id="primary-nav" class="nav-menu">
            <a href="../../index.html">Accueil</a>
            <a href="../projets/projets.html">Projets</a>
            <a href="">Heures</a>
            <a href="../../index.html#contact">Contact</a>

        </nav>
    </header>
    <section id ="table-hours">
    <h1>Heures de Projets Prestées</h1>
    <table id="hours-table" data-source="../../assets/data/heures.json" data-details-source="../../assets/data/heures-details.json">
        <caption>Résumé des heures par projet</caption>
        <thead>
            <tr>
                <th>Projet</th>
                <th>Description</th>
                <th class="hours-count">Heures reelles</th>
                <th class="hours-count">Heures comptabilisees</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="4">Chargement des donnees...</td>
            </tr>
        </tbody>
        <tfoot>
            <tr id="total-row">
                <td colspan="3" id="total-cell">Total comptabilise</td>
                <td class="hours-count">0</td>
            </tr>
        </tfoot>
    </table>
    <div id="project-modal" class="project-modal" aria-hidden="true">
        <div class="project-modal__backdrop" data-close-modal="true"></div>
        <div class="project-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
            <button id="project-modal-close" class="project-modal__close" type="button" aria-label="Fermer">X</button>
            <h2 id="project-modal-title">Details du projet</h2>
            <p id="project-modal-text"></p>
            <div id="project-modal-gallery" class="project-modal__gallery"></div>
        </div>
    </div>
    <div id="image-lightbox" class="image-lightbox" aria-hidden="true">
        <div class="image-lightbox__backdrop" data-close-lightbox="true"></div>
        <div class="image-lightbox__dialog" role="dialog" aria-modal="true" aria-labelledby="image-lightbox-caption">
            <button id="image-lightbox-close" class="image-lightbox__close" type="button" aria-label="Fermer l'image">X</button>
            <img id="image-lightbox-img" src="" alt="">
            <p id="image-lightbox-caption" class="image-lightbox__caption"></p>
        </div>
    </div>
    <script src="../../assets/js/main.js"></script>
</body>
</html>
